{% extends "base_generic.html" %}
{% block content %}
<h1>Delete Book</h1>
{% if error %}
    <p class="text-danger">{{ error }}</p>
{% endif %}
<p>Are you sure you want to delete the book: {{ book }}?</p>
<form action="" method="POST">
    {% csrf_token %}
    <input type="submit" value="Yes, delete." />
</form>
{% endblock %}
